# The Atlas pipeline: pull headlines, draft missing or stale reports with the Claude API
# (when the ANTHROPIC_API_KEY secret is set), commit any new content to main, publish the
# static site to GitHub Pages and redeploy the enterprise edition when reports changed. Runs on
# every push that touches apps/atlas, every hour, and on demand.
name: "Atlas: wire, reports, publish"

on:
  push:
    branches: [main]
    paths: ["apps/atlas/**", ".github/workflows/atlas-pages.yml"]
  schedule:
    # Every hour at :17. GitHub delays and sometimes drops scheduled runs set on the hour, so
    # this sits off it; a run can still start a few minutes late when GitHub is busy. Each run
    # pulls fresh headlines; reports are drafted only when missing or stale, so most hourly runs
    # cost no Claude API calls.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      stale_days:
        description: "Re-draft auto-drafted reports of developing events older than this many days (0 = only missing ones)"
        default: "7"
      max_reports:
        description: "Cap on reports drafted in this run (0 = no cap)"
        default: "0"

permissions:
  contents: write
  id-token: write # lets the job mint a GitHub OIDC token for keyless access to the Claude API

concurrency:
  group: atlas
  cancel-in-progress: false

jobs:
  atlas:
    runs-on: ubuntu-latest
    env:
      # Credentials for drafting, either of:
      #  - a repository secret ANTHROPIC_API_KEY, or
      #  - workload identity federation: repository *variables* ANTHROPIC_ORGANIZATION_ID,
      #    ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_SERVICE_ACCOUNT_ID (+ ANTHROPIC_WORKSPACE_ID),
      #    set up in the Claude Console (Organization settings → Workload identity → Connect workload →
      #    GitHub Actions, subject repo:neel8636/Geopolitica:ref:refs/heads/main). No key is stored.
      HAS_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || vars.ANTHROPIC_FEDERATION_RULE_ID != '' }}
      HAS_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
    defaults:
      run:
        working-directory: apps/atlas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/atlas/package-lock.json
      - run: npm ci --no-audit --no-fund

      - name: Pull the wire
        run: npm run wire || echo "wire fetch failed; building with the committed wire.json"

      - name: Draft reports
        if: env.HAS_AUTH == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          STALE: ${{ github.event.inputs.stale_days || '7' }}
          MAX: ${{ github.event.inputs.max_reports || '0' }}
        run: |
          EXTRA=""
          if [ "$MAX" != "0" ]; then EXTRA="--max $MAX"; fi
          npm run draft -- --all --stale "$STALE" $EXTRA || echo "drafting had failures; publishing what succeeded"

      - name: Commit new content to main
        id: commit
        run: |
          git config user.name "geopolitica-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/wire.json src/content/dossiers
          if git diff --cached --quiet -- src/content/dossiers; then echo "reports=false" >> "$GITHUB_OUTPUT"; else echo "reports=true" >> "$GITHUB_OUTPUT"; fi
          if git diff --cached --quiet; then
            echo "no content changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Atlas: wire and reports refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the workflow token does not trigger other workflows, so the
      # enterprise edition is redeployed from here, only when reports changed: headlines change
      # every hour, and an hourly rebuild would use up Render's free build minutes.
      - name: Redeploy the enterprise edition
        if: steps.commit.outputs.reports == 'true' && env.HAS_HOOK == 'true'
        run: curl -sS -o /dev/null -w "Render answered %{http_code}\n" -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: /${{ github.event.repository.name }}
          # the enterprise server that generates reports on demand from an event page
          NEXT_PUBLIC_REPORT_API: ${{ vars.REPORT_API || 'https://geopolitica-1rja.onrender.com' }}
          # Reader sign-up (Firebase project geopolitica-941b0). The web config is public by design
          # (it names the project; Auth and the Firestore rules do the protecting). Repository
          # variables of the same names override these defaults.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || 'AIzaSyA_bnPFuNY131FtUrpsEgkonFPyKwMnuzs' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN || 'geopolitica-941b0.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'geopolitica-941b0' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || '1:600266158045:web:1a40696fc81a511add1034' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || 'geopolitica-941b0.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID || '600266158045' }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID || 'G-HNQBF1FW1B' }}
        run: npm run build

      # Pushing the build to a gh-pages branch is what Pages serves (Settings → Pages → gh-pages, root).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/atlas/out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish atlas from ${{ github.sha }}"
