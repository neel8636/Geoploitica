# Publishes the personal edition (apps/atlas) to GitHub Pages as a static site.
# Runs on every push that touches apps/atlas, once a day to refresh the wire, and on demand.
name: Atlas to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["apps/atlas/**", ".github/workflows/atlas-pages.yml"]
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC: pull fresh headlines and rebuild
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/atlas/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Pull the wire
        run: npm run wire || echo "wire fetch failed; building with the committed wire.json"
      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
      # Pushing the build to a gh-pages branch turns Pages on for the repo by itself,
      # so no settings click is needed. The site serves from that branch's root.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/atlas/out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish atlas from ${{ github.sha }}"
